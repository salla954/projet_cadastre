{% extends "base.html" %}
{% block titre %}{{ actualite.titre }}{% endblock %}
{% block contenu %}
<section class="section">
  <div class="conteneur" style="max-width:760px;">
    <span class="date">{{ actualite.date_publication|date:"d F Y" }}</span>
    <h1>{{ actualite.titre }}</h1>
    <p>{{ actualite.contenu|linebreaks }}</p>
    <a href="{% url 'core:liste_actualites' %}">← Retour aux actualités</a>
  </div>
</section>
{% endblock %}
