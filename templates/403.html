{% extends "base.html" %}
{% block titre %}Accès refusé{% endblock %}
{% block contenu %}
<section class="section motif-cadastral" style="min-height:60vh; display:flex; align-items:center;">
  <div class="conteneur" style="text-align:center; max-width:560px;">
    <div class="hero-eyebrow" style="background:var(--sable-fonce); border-color:var(--sable-fonce); color:var(--danger);">Erreur 403</div>
    <h1 style="font-size:2rem; margin-top:1rem;">Accès refusé</h1>
    <p style="color:#4b5262;">Votre rôle ne vous permet pas d'accéder à cette page. Contactez un administrateur si vous pensez qu'il s'agit d'une erreur.</p>
    <a href="{% url 'core:accueil' %}" class="btn btn-primaire" style="margin-top:1rem;">Retour à l'accueil</a>
  </div>
</section>
{% endblock %}
